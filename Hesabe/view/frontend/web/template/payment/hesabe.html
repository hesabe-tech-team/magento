<div class="payment-method" data-bind="css: {'_active': isSelected()}">
    <div class="payment-method-title field choice">
      <input type="radio"
             name="payment[method]"
             data-bind="
               attr: {id: getCode()},
               value: getCode(),
               checked: isSelected,
               click: selectPaymentMethod
             "/>
      <label data-bind="attr: {for: getCode()}, text: getTitle()"></label>
    </div>
    <div class="payment-method-content">
      <div class="actions-toolbar">
        <div class="primary">
          <button class="action primary checkout"
                  type="button"
                  data-bind="
                    click: placeOrder,
                    enable: isPlaceOrderActionAllowed()
                  ">
            <span data-bind="i18n: 'Place Order'"></span>
          </button>
        </div>
      </div>
    </div>
  </div>
